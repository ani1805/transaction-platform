name: Transaction Platform CI Pipeline
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  ci-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
           java-version: '17'
           distribution: 'temurin'
           cache: maven
      - name: Build
        run: ./mvnw clean package